# Builds the Chud GFX Baby desktop app (ChudGFX.exe) on Windows and publishes it as
# a GitHub release (v1.0.<run number>) with ChudGFX-windows.zip. The app
# checks the latest release on launch and offers to update itself. Each
# release also gets Chud-GFX-Baby-Setup.exe, an installer that downloads the
# latest release from GitHub when it runs, and SCC-GFX-Companion-module.tgz (the
# Bitfocus Companion module, imported on Companion's Modules page).
#
# A commit with [no release] in its message builds and tests without publishing.
#
# Every run also leaves the zip on the run's summary page (Actions tab).
name: Build Windows app

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: v1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements-windows.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Stamp the version
        shell: pwsh
        run: |
          Set-Content gfxengine/version.py "VERSION = `"$env:VERSION`"" -Encoding utf8
          Get-Content gfxengine/version.py

      - name: Build ChudGFX.exe
        run: pyinstaller --noconfirm ChudGFX.spec

      - name: Smoke test the built app
        shell: pwsh
        run: |
          $app = "dist\ChudGFX"
          $p = Start-Process "$app\ChudGFX.exe" -ArgumentList '--smoke-test', '--port', '8797' -PassThru -Wait
          Get-Content "$app\smoke-test.txt"
          if ($p.ExitCode -ne 0) { throw "Smoke test failed (exit code $($p.ExitCode))" }
          # Leave no test leftovers in the download.
          Remove-Item "$app\smoke-test.txt", "$app\settings.json" -ErrorAction SilentlyContinue
          Remove-Item "$app\workspace", "$app\workspaces", "$app\library" -Recurse -ErrorAction SilentlyContinue
          # (a workspace in the download would replace the user's graphics, schedule and settings on every update)
          foreach ($d in "workspace", "workspaces", "library", "settings.json") { if (Test-Path "$app\$d") { throw "$d left in the download" } }
          Remove-Item "$app\_update" -Recurse -ErrorAction SilentlyContinue

      - name: Add readme and version.txt
        shell: pwsh
        run: |
          Copy-Item README.md dist\ChudGFX\
          # (Chud Hud Hub reads the installed version from it)
          Set-Content dist\ChudGFX\version.txt $env:VERSION -NoNewline

      - uses: actions/upload-artifact@v4
        with:
          name: ChudGFX-windows
          path: dist/ChudGFX

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the Companion module (SCC-GFX-Companion-module.tgz)
        shell: pwsh
        working-directory: companion-module
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE) { exit 1 }
          npm version --no-git-tag-version --allow-same-version $env:VERSION.TrimStart('v')
          npm run check
          if ($LASTEXITCODE) { exit 1 }
          npx companion-module-build
          if ($LASTEXITCODE) { exit 1 }
          Move-Item chud-gfx-*.tgz ..\SCC-GFX-Companion-module.tgz

      - name: Build the installer
        if: "!contains(github.event.head_commit.message, '[no release]')"
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DAppVersion=$($env:VERSION.TrimStart('v'))" installer\Chud-GFX.iss
          if ($LASTEXITCODE) { exit 1 }

      - name: Publish release
        if: "!contains(github.event.head_commit.message, '[no release]')"
        # The app zip and the installer go up together, so the latest release
        # always has both (the installer link never 404s mid-build).
        shell: pwsh
        run: |
          Compress-Archive -Path dist\ChudGFX\* -DestinationPath ChudGFX-windows.zip
          $notes = git log -1 --format=%B | Where-Object { $_ -notmatch '^(Co-Authored-By|Claude-Session):' }
          $notes = ($notes -join "`n").Trim()
          gh release create "$env:VERSION" ChudGFX-windows.zip dist\Chud-GFX-Baby-Setup.exe SCC-GFX-Companion-module.tgz --target "${{ github.sha }}" --title "Chud GFX Baby $env:VERSION" --notes "$notes"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test the installer (silent; installs the release just published)
        if: "!contains(github.event.head_commit.message, '[no release]')"
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\Chud GFX Baby test"
          $installArgs = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dir`"", '/MERGETASKS="!desktopicon"', '/LOG=install.log'
          $p = Start-Process dist\Chud-GFX-Baby-Setup.exe -ArgumentList $installArgs -PassThru -Wait
          Get-Content install.log -Tail 25
          if ($p.ExitCode -ne 0) { throw "Installer failed (exit code $($p.ExitCode))" }
          if (-not (Test-Path "$dir\ChudGFX.exe")) { throw "ChudGFX.exe wasn't installed" }
          if (-not (Test-Path "$dir\_internal")) { throw "_internal wasn't installed" }
          Write-Host "Installed OK to $dir"
