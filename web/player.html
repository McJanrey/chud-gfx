<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StandBy GFX graphic</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  .sg-stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; }
  .sg-comp, .sg-cover, .sg-stinger { position: absolute; inset: 0; }
  .sg-layer { position: absolute; box-sizing: border-box; }
  .sg-fill { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .sg-text { white-space: pre; display: inline-block; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
// An exported graphic that plays without the engine (HTML export). As a CasparCG / SPX template it answers
// play(), stop(), next(), update(data) and remove(). URL: ?autoplay=0 waits for play(); ?live=<engine address>
// follows that engine's data; any other ?Field=value fills that field.
import { Stage, W, H } from "./engine/stage.js";
const q = new URLSearchParams(location.search);
const root = document.getElementById("stage");
const stage = new Stage(root, { bus: "program", base: "." });
const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); root.style.transform = `scale(${k})`; };
addEventListener("resize", fit); fit();

// (the host can call play() / update() as soon as the page loads, before state.json is in: those wait, then run)
let snap = null, ids = [], values = {}, at = 0, on = false;
const waiting = [];
const when = fn => (...a) => { if (snap) fn(...a); else waiting.push(() => fn(...a)); };

window.play = when(() => { on = true; show("animate"); });
window.stop = when(() => { on = false; show("animate"); });
window.next = when(() => { if (ids.length > 1) { at = (at + 1) % ids.length; show("animate"); } });
window.remove = when(() => { on = false; show("cut"); });
window.update = when(data => {   // CasparCG sends XML or JSON; SPX sends an object
  let d = data;
  if (typeof d === "string") {
    try { d = JSON.parse(d); } catch (e) {
      d = {};
      for (const c of new DOMParser().parseFromString(data, "text/xml").querySelectorAll("componentData")) d[c.getAttribute("id")] = c.querySelector("data")?.getAttribute("value") ?? "";
    }
  }
  for (const id of ids) Object.assign(values[id], d || {});
  show("cut");
});

const loaded = await fetch("state.json").then(r => r.json());
ids = loaded.project.compositions.map(c => c.id);
const fromUrl = Object.fromEntries([...q].filter(([k]) => !["autoplay", "live"].includes(k)));
values = Object.fromEntries(ids.map(id => [id, { ...fromUrl }]));
snap = loaded;
const css = document.createElement("style");
css.textContent = (snap.fonts || []).map(f => `@font-face{font-family:"${f.name.replace(/"/g, "")}";src:url("${encodeURI(f.url)}");${f.weight ? `font-weight:${f.weight};` : ""}font-display:block}`).join("\n");
document.head.appendChild(css);
const state = () => ({ ...snap, live: { program: { on: on ? [ids[at]] : [], values, seq: 0 }, preview: { on: [], values: {} }, cut: { seq: 0 } } });
function show(mode) { stage.sync(state(), mode); }

if (q.get("live")) {   // follow an engine's live data (tables), still playing on its own
  const base = q.get("live").replace(/\/$/, "");
  const es = new EventSource(base + "/api/stream");
  es.onmessage = e => { const m = JSON.parse(e.data); if (m.data) { snap.data = m.data; show("cut"); } };
}
if (q.get("autoplay") !== "0") window.play(); else show("cut");
waiting.splice(0).forEach(fn => fn());   // (after autoplay: what the host asked for wins)
</script>
</body>
</html>
