<!doctype html>
<!-- StandBy GFX · VALORANT reader check: shows what the screen reader is reading, live. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VALORANT reader check</title>
<style>
  :root { --bg: #0e1117; --panel: #161b22; --ink: #e6edf3; --muted: #8b949e; --teal: #14b8a6; --coral: #f2715a; --line: #30363d }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, "Segoe UI", sans-serif; padding: 20px }
  .bar { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0; max-width: 1100px; margin: 0 auto 18px; align-items: stretch }
  .team { display: flex; align-items: center; gap: 14px; padding: 10px 16px; font-weight: 700; font-size: 22px }
  .team.l { background: var(--teal); color: #031; justify-content: flex-end } .team.r { background: var(--coral); color: #300 }
  .team .side { font-size: 12px; opacity: .8 } .team .sc { font-size: 40px; min-width: 44px; text-align: center }
  .mid { background: #000; padding: 6px 22px; text-align: center; min-width: 130px }
  .mid .t { font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums } .mid .r { color: var(--muted); font-size: 12px }
  .spike { color: #ff4d4d; font-weight: 800 }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; max-width: 1100px; margin: 0 auto }
  .p { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums } td { padding: 6px 4px; border-bottom: 1px solid var(--line) }
  .hp { width: 90px; height: 8px; background: #222; border-radius: 4px; overflow: hidden } .hp i { display: block; height: 100% }
  .dead td { opacity: .4 } .k { color: var(--muted); font-size: 12px }
  .feed { max-width: 1100px; margin: 18px auto 0 } .hs { color: #ff4d4d; font-size: 12px }
  .status { max-width: 1100px; margin: 0 auto 10px; color: var(--muted); font-size: 13px }
</style>
</head>
<body>
<div class="status" id="status">Connecting…</div>
<div class="bar"><div class="team l" id="lt"></div><div class="mid" id="mid"></div><div class="team r" id="rt"></div></div>
<div class="grid"><div class="p"><table id="L"></table></div><div class="p"><table id="R"></table></div></div>
<div class="p feed"><table id="K"></table></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
async function tick() {
  try {
    const st = await (await fetch("/api/state")).json();
    const rows = (st.data.tables || {}).VALORANT || [], f = Object.fromEntries(rows.slice(1));
    const r = (st.val || {}).reader || {};
    $("status").textContent = `Reader: ${r.on ? "on" : "off"} · screen ${r.screen} · ${r.status || ""} · engine VALORANT: ${(st.val || {}).status}`;
    const side = s => `<span class="side">${esc(f[s + " side"])}</span>`;
    $("lt").innerHTML = `${esc(f["Left name"] || "Left")} ${side("Left")}<span class="sc">${esc(f["Left score"])}</span>`;
    $("rt").innerHTML = `<span class="sc">${esc(f["Right score"])}</span>${side("Right")} ${esc(f["Right name"] || "Right")}`;
    $("mid").innerHTML = f.Spike === "planted" ? `<div class="t spike">SPIKE</div><div class="r">planted · round ${esc(f.Round)}</div>`
      : `<div class="t">${esc(f.Timer || "–")}</div><div class="r">round ${esc(f.Round)} · ${esc(f.Phase || "")}</div>`;
    for (const [id, s] of [["L", "Left"], ["R", "Right"]]) {
      let h = `<tr class="k"><td>player</td><td>health</td><td>ult</td><td>K/D/A</td><td>credits</td><td>weapon</td><td>armor</td></tr>`;
      for (let n = 1; n <= 5; n++) {
        const g = k => f[`${s} ${n} ${k}`], hp = +g("health") || 0, alive = g("alive") !== "no";
        h += `<tr class="${alive ? "" : "dead"}"><td>${esc(g("name") || "slot " + n)}</td>
          <td>${alive ? `<div class="hp"><i style="width:${hp}%;background:${hp > 50 ? "#3fb950" : hp > 25 ? "#d29922" : "#f85149"}"></i></div>` : "dead"}</td>
          <td>${esc(g("ult"))}${g("ult max") ? "/" + esc(g("ult max")) : ""}</td><td>${esc(g("kd"))}</td><td>${esc(g("credits"))}</td><td>${esc(g("weapon"))}</td><td>${esc(g("armor"))}</td></tr>`;
      }
      $(id).innerHTML = h;
    }
    let k = `<tr class="k"><td>kill feed (newest first)</td><td></td><td></td></tr>`;
    for (let n = 1; n <= 5; n++) if (f[`Kill ${n} killer`]) k += `<tr><td>${esc(f[`Kill ${n} killer`])} <span class="k">(${esc(f[`Kill ${n} killer side`])})</span></td>
      <td>${esc(f[`Kill ${n} weapon`] || "?")}${f[`Kill ${n} headshot`] === "yes" ? ' <span class="hs">headshot</span>' : ""}</td><td>${esc(f[`Kill ${n} victim`])}</td></tr>`;
    $("K").innerHTML = k;
  } catch (e) { $("status").textContent = "Engine not reachable"; }
}
setInterval(tick, 500); tick();
</script>
</body>
</html>
