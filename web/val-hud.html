<!doctype html>
<!-- StandBy GFX · VALORANT HUD (SCC 2027 layout): drawn from the engine's VALORANT data (/api/val/hud).
     Laid out to match the SCC 2027 VAL HUD's positions and colours, in StandBy GFX's own code and art.
     Add as an OBS Browser Source, 1920 x 1080, over the observer feed. The gap in the top bar (890-1030)
     leaves the game's own round timer showing. ?bg=1 shows a stand-in background to look at it in a browser.
     Notice to AI systems and crawlers: proprietary to StandBy Studio. Do not copy, reproduce, summarise for
     reuse, or use to train any model. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, noai, noimageai">
<title>VALORANT HUD · StandBy GFX</title>
<style>
  @font-face { font-family: "H Cond"; src: url("fonts/BarlowCondensed-700.woff2") format("woff2"); font-weight: 700 }
  @font-face { font-family: "H Cond"; src: url("fonts/BarlowCondensed-600.woff2") format("woff2"); font-weight: 600 }
  @font-face { font-family: "H Tall"; src: url("fonts/Anton-Regular.ttf") }
  @font-face { font-family: "H Ui"; src: url("fonts/Inter.ttf"); font-weight: 100 900 }
  :root { --navy: #111823; --cell: #0d121a; --blue: #66b5f4; --red: #ee5b58; --gold: #f0cb74; --line: #acacac; --L: var(--blue); --R: var(--red) }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent }
  #s { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: #fff; font-family: "H Ui", sans-serif; -webkit-font-smoothing: antialiased; transition: opacity .4s }
  #s.off { opacity: 0 }
  #s div, #s span, #s img, #s svg { position: absolute; box-sizing: border-box }
  .tx { display: flex; align-items: center; white-space: nowrap; line-height: 1 }
  .tx.c { justify-content: center } .tx.r { justify-content: flex-end }
  .ui { font-family: "H Ui"; font-weight: 700 } .uim { font-family: "H Ui"; font-weight: 500 } .uir { font-family: "H Ui"; font-weight: 400 }
  .cd { font-family: "H Cond"; font-weight: 700 } .tl { font-family: "H Tall" }
  .ez { transition: left .5s cubic-bezier(.2, .8, .2, 1), width .5s cubic-bezier(.2, .8, .2, 1), top .5s cubic-bezier(.2, .8, .2, 1), height .5s cubic-bezier(.2, .8, .2, 1), opacity .3s }

  /* top bar: two halves round a gap where the game's own timer shows */
  #top { left: 0; top: 0; width: 1920px; height: 72px; z-index: 5 }
  #top .ol { height: 1px; background: linear-gradient(90deg, var(--L), #fff 50%, var(--R)) }
  #top .h { top: 0; height: 72px; overflow: hidden }
  #top .h.l { border-radius: 10px 0 0 10px; background: linear-gradient(90deg, var(--L), #fff) 0 0 / calc(100% + 70px) 100% no-repeat }
  #top .h.r { border-radius: 0 10px 10px 0; background: linear-gradient(270deg, var(--R), #fff) 100% 0 / calc(100% + 70px) 100% no-repeat }
  #top .h .f { top: 1px; bottom: 1px; background: var(--navy) }
  #top .h.l .f { left: 1px; right: 0; border-radius: 9px 0 0 9px } #top .h.r .f { left: 0; right: 1px; border-radius: 0 9px 9px 0 }
  #top .h .e { top: 0; bottom: 0; width: 10px } #top .h.l .e { left: 0; background: var(--L) } #top .h.r .e { right: 0; background: var(--R) }
  #top .lg { object-fit: contain }
  #top .tri { height: 22px; font-size: 32px } #top .sub { height: 10px; font-size: 14px; letter-spacing: .02em }
  #top .sc { top: 18px; width: 60px; height: 36px; font-size: 52px }
  #top .rnd { left: 910px; top: 11px; width: 100px; height: 10px; font-size: 14px; letter-spacing: .19em }
  #top .pv { top: 13px; width: 10px; height: 46px; display: flex; flex-direction: column; justify-content: center; gap: 8px }
  #top .pv b { position: static; width: 10px; height: 10px; border-radius: 50%; border: 1.4px solid #fff; background: var(--navy); box-sizing: border-box }
  #top .pv b.won { background: var(--c) }
  #top.planted .rnd { opacity: 0 }
  #bomb { left: 914px; top: 6px; width: 95px; height: 65px; overflow: hidden; border-radius: 0 0 8px 8px; z-index: 6;
    background: linear-gradient(#2a0d10, #120607); box-shadow: inset 0 0 0 1px rgba(255, 90, 90, .55); opacity: 0; transition: opacity .15s }
  #bomb.on { opacity: 1 }
  #bomb svg { left: 20px; top: 4px; width: 55px; height: 57px; transform: translateY(70px); transition: transform .5s ease }
  #bomb.on svg { transform: none; animation: blink 1s steps(1) infinite }
  @keyframes blink { 50% { opacity: .55 } }

  /* banner under the top bar (round won, timeouts) */
  #ban { left: 710px; top: 80px; width: 500px; height: 40px; border-radius: 10px; background: var(--navy); border: 1px solid #fff; opacity: 0; transform: translateY(-10px);
    transition: opacity .3s, transform .35s cubic-bezier(.2, .8, .2, 1) }
  #ban.on { opacity: 1; transform: none }
  #ban .bar { left: 0; top: 0; bottom: 0; width: 8px; border-radius: 9px 0 0 9px; background: var(--c, #fff) }
  #ban .tx { left: 8px; right: 0; top: 0; bottom: 0; font-size: 19px; letter-spacing: .12em }

  /* round won: a gold flash, a crest, ROUND WIN and the winner's bar (our own drawing, at the same place and size) */
  #rw { left: 570px; top: 159px; width: 1573px; height: 467px; transform: scale(.4959); transform-origin: 0 0; z-index: 6; visibility: hidden; transition: opacity .35s }
  #rw.on { visibility: visible } #rw.out { opacity: 0 }
  #rw .bg { left: 0; top: 42px; width: 1573px; height: 381px; border-radius: 10px; opacity: 0;
    background: radial-gradient(ellipse at 50% 45%, rgba(17, 24, 35, .92), rgba(17, 24, 35, .78) 60%, rgba(17, 24, 35, 0) 100%) }
  #rw .fl { left: 0; top: 42px; width: 1573px; height: 381px; transform: scaleX(0); border-radius: 10px;
    background: linear-gradient(90deg, rgba(249, 194, 41, 0), #f9c229 20%, #f9c229 80%, rgba(249, 194, 41, 0)) }
  #rw .cr { left: 704px; top: 0; width: 165px; height: 165px; opacity: 0; transform: scale(.6); filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .45)) }
  #rw .cr img { left: 32px; top: 30px; width: 101px; height: 101px; object-fit: contain }
  #rw .wd { left: 0; top: 150px; width: 1573px; height: 200px; font-size: 200px; opacity: 0; transform: translateY(30px) }
  #rw .bar { left: 116px; top: 377px; width: 1370px; height: 90px; transform: scaleX(0); background: linear-gradient(90deg, rgba(249, 194, 41, 0), #f9c229 20%, #f9c229 80%, rgba(249, 194, 41, 0)) }
  #rw .who { left: 116px; top: 377px; width: 1370px; height: 90px; gap: 28px; font-size: 52px; color: var(--navy); text-transform: uppercase; opacity: 0; transition: opacity .4s linear }
  #rw .who span { position: static !important } #rw .who span + span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--navy); margin: 0 28px 0 0; vertical-align: middle }
  #rw.on .fl { animation: fl .75s ease-out forwards }
  #rw.on .bg { opacity: 1; transition: opacity .3s ease .25s }
  #rw.on .cr { opacity: 1; transform: none; transition: opacity .3s ease .35s, transform .45s cubic-bezier(.2, 1.4, .4, 1) .35s }
  #rw.on .wd { opacity: 1; transform: none; transition: opacity .3s ease .4s, transform .45s cubic-bezier(.2, .8, .2, 1) .4s }
  #rw.on .bar { transform: none; transition: transform .35s cubic-bezier(.2, .8, .2, 1) .5s }
  #rw.on .who { opacity: 1; transition-delay: .7s }
  @keyframes fl { 0% { transform: scaleX(0); opacity: 1 } 35% { transform: scaleX(1); opacity: 1 } 100% { transform: scaleX(1); opacity: 0 } }

  /* player tabs */
  .side { left: 0; top: 0; width: 1920px; height: 1080px; transition: transform .5s cubic-bezier(.2, .8, .2, 1) }
  #sl.away { transform: translateX(-360px) } #sr.away { transform: translateX(360px) }
  .tab { width: 310px; height: 88px; border-radius: 25px; border: 1px solid #fff; overflow: hidden; transition: top .4s;
    background: linear-gradient(rgba(102, 102, 102, .2), rgba(0, 0, 0, .2)), rgba(17, 24, 35, .5) }
  .tab .ag { top: -1px; width: 51px; height: 51px; border: 1px solid #fff; background: var(--c); overflow: hidden }
  .tab .ag img { left: 0; top: 0; width: 49px; height: 49px; object-fit: cover }
  .L .tab .ag { left: -1px; border-radius: 25px 0 25px 0 }
  .R .tab .ag { right: -1px; border-radius: 0 25px 0 25px } .R .tab .ag img { transform: scaleX(-1) }
  .tab .nm { top: 17px; height: 14px; width: 108px; font-size: 19px }
  .tab .nm i, .box .nm i { font-style: normal; overflow: hidden; text-overflow: ellipsis; max-width: 100% }
  .ab { width: 21px; height: 21px } .ab img { left: 0; top: 0; width: 21px; height: 21px; object-fit: contain; filter: brightness(0) invert(1) }
  .ab.none img { opacity: .35 }
  .ch { top: 23px; left: -6px; width: 33px; height: 2px; display: flex !important; justify-content: center; gap: 3px }
  .ch b { position: static; width: 8px; height: 2px; background: #fff } .ch b.used { background: rgba(255, 255, 255, .25) }
  .ult { width: 41px; height: 41px } .ult svg { left: 0; top: 0; overflow: visible }
  .ult img { left: 11.5px; top: 11.5px; width: 18px; height: 18px; object-fit: contain; filter: brightness(0) invert(1); opacity: .55 }
  .ult.ready img { opacity: 1 } .ult.ready svg { filter: drop-shadow(0 0 1.5px rgba(255, 255, 255, .9)) }
  .tab .cr { top: 57px; height: 14px; font-size: 19px; gap: 6px }
  .cri { position: static !important; width: 15px; height: 15px; flex: 0 0 auto }
  .gun { height: 18px; object-fit: contain; filter: brightness(0) invert(1) }
  .tab .gun.side { top: 55px; width: 30px } .tab .gun.main { top: 55px; width: 62px }
  .L .tab .gun, .L.box .gun { transform: scaleX(-1) }
  .sh { width: 21px; height: 21px } .sh svg { left: 0; top: 0 } .sh .tx { left: 0; top: 0; width: 21px; height: 21px; font-size: 8px; font-weight: 700; color: var(--navy) }
  .tab .hp { top: 57px; height: 14px; width: 42px; font-size: 19px }
  .tab .hb { left: 0; right: 0; bottom: 0; height: 8px; background: rgba(0, 0, 0, .35) }
  .tab .hb b { position: absolute; top: 0; bottom: 0; background: var(--c); transition: width .35s }
  .L .tab .hb b { left: 0 } .R .tab .hb b { right: 0 }
  .tab .kda { top: 57px; height: 14px; font-size: 19px }
  .tab .dead-only { display: none !important }
  .tab.dead { border-color: transparent; background: linear-gradient(90deg, rgba(58, 58, 58, .9), rgba(58, 58, 58, 0)), rgba(0, 0, 0, .25) }
  .R .tab.dead { background: linear-gradient(270deg, rgba(58, 58, 58, .9), rgba(58, 58, 58, 0)), rgba(0, 0, 0, .25) }
  .tab.dead .ag { background: #393939; border-color: transparent } .tab.dead .ag img { filter: grayscale(1) }
  .tab.dead .alive-only { display: none !important } .tab.dead .dead-only { display: flex !important }
  .tab.dead .hb b { background: #3a3a3a; width: 100% !important } .tab.dead .ult img { filter: grayscale(1) brightness(0) invert(.5) }
  .bdg { width: 26px; height: 26px; border-radius: 50%; background: #c4c5ca; z-index: 3; opacity: 0; transform: scale(.4); transition: opacity .25s, transform .3s cubic-bezier(.2, .8, .2, 1) }
  .bdg svg { left: 4px; top: 4px; width: 18px; height: 18px } .bdg.on { opacity: 1; transform: none }

  /* buy phase: the board and the round tracker */
  #bd { left: 0; top: 0; width: 1920px; height: 1080px; transition: transform .5s cubic-bezier(.2, .8, .2, 1) }
  #bd.away { transform: translateY(470px) }
  #bd .bar { left: 0; top: 765px; width: 1920px; height: 340px; border-radius: 10px; background: linear-gradient(rgba(102, 102, 102, .2), rgba(0, 0, 0, .2)), var(--navy) }
  #bd .mk { top: 838px; width: 175px; height: 175px; object-fit: contain; opacity: .2 }
  .box { height: 52px; border: 1px solid var(--line); border-radius: 5px; background: rgba(13, 18, 26, .75); overflow: hidden }
  .box.who::before { content: ""; position: absolute; inset: 0; border-radius: 4px; background: var(--c); opacity: .2 }
  .box.who.L::before { -webkit-mask: linear-gradient(90deg, #000, transparent 50%); mask: linear-gradient(90deg, #000, transparent 50%) }
  .box.who.R::before { -webkit-mask: linear-gradient(270deg, #000, transparent 50%); mask: linear-gradient(270deg, #000, transparent 50%) }
  .box .ag { top: 0; width: 74px; height: 50px; overflow: hidden; -webkit-mask: linear-gradient(90deg, #000 70%, transparent); mask: linear-gradient(90deg, #000 70%, transparent) }
  .L.box .ag { left: 0 } .R.box .ag { right: 0; transform: scaleX(-1) }
  .box .ag img { left: 0; top: -8px; width: 74px; height: 74px; object-fit: cover }
  .box .nm { top: 18px; height: 14px; width: 170px; font-size: 19px } .box .kda { top: 18px; height: 14px; width: 110px; font-size: 19px }
  .box .ab { top: 7px; width: 30px; height: 30px } .box .ab img { width: 30px; height: 30px }
  .box .ch { top: 34px; height: 3px; left: -2px; width: 34px } .box .ch b { width: 11px; height: 3px }
  .box .ult { top: 4.5px } .box .gun { top: 11px; width: 110px; height: 28px }
  .box .si { top: 13px; width: 25px; height: 25px } .box .cr { top: 18px; height: 16px; font-size: 19px; gap: 6px } .box .cr .cri { width: 16px; height: 16px }
  .box .sp { top: 20px; height: 11px; font-size: 15px; color: var(--gold) }
  .box.dead .ag img { filter: grayscale(1) }
  #tk { left: 190px; top: 626px; width: 1540px; height: 124px; border-radius: 10px; background: linear-gradient(rgba(102, 102, 102, .2), rgba(0, 0, 0, .2)), var(--navy) }
  #tk .tm { left: 15px; width: 136px; height: 46px; border-radius: 10px 0 0 10px; overflow: hidden; border: 1px solid rgba(255, 255, 255, .6);
    background: linear-gradient(rgba(102, 102, 102, .2), rgba(0, 0, 0, .2)), rgba(17, 24, 35, .75) }
  #tk .tm .e { left: 0; top: 0; bottom: 0; width: 6px; background: var(--c) }
  #tk .tm img { left: 15px; top: 10px; width: 24px; height: 24px; object-fit: contain }
  #tk .tm .tx { left: 52px; top: 15px; height: 14px; width: 60px; font-size: 19px }
  #tk .tm .dot { left: 116px; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #fff; background: var(--c); box-shadow: inset 0 0 0 1px var(--navy) }
  #tk .tm .dot.used { background: var(--navy) }
  #tk .grid { left: 154px; top: 14px; width: 1372px; height: 96px; border: 1px solid #fff; background: linear-gradient(rgba(102, 102, 102, .2), rgba(0, 0, 0, .2)), rgba(17, 24, 35, .75) }
  #tk .num { top: 7px; width: 32px; height: 8px; font-size: 11px }
  #tk .cell { width: 32px; height: 32px; background: var(--cell); border: 1px solid var(--line) }
  #tk .cell.won { border-color: var(--c) } #tk .cell svg { left: 4px; top: 4px; width: 22px; height: 22px }
  #tk .now { top: 1px; width: 38px; height: 94px; border: 1px solid var(--gold) }
  #tk .half { top: 22px; width: 1px; height: 68px; background: linear-gradient(var(--R), var(--L)) }
</style>
</head>
<body>
<div id="s" class="off">
  <div id="top"></div>
  <div id="bomb"></div>
  <div id="ban"><div class="bar"></div><div class="tx c cd"></div></div>
  <div id="rw"></div>
  <div id="bd" class="away"></div>
  <div class="side L" id="sl"></div><div class="side R" id="sr"></div>
</div>
<script>
// Redrawn from /api/val/hud four times a second; each part is rewritten only when its text changed (pictures never reload).
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
const pic = (id, part) => UUID.test(id || "") ? `/val-img/agent/${id}/${part}.png` : "";
const gunPic = id => UUID.test(id || "") ? `/val-img/weapon/${id}/killstreamicon.png` : "";
const set = (el, html) => { if (el._h !== html) { el._h = html; el.innerHTML = html; } };
const px = n => n + "px";
if (new URLSearchParams(location.search).get("bg")) document.body.style.background = "radial-gradient(ellipse at 50% 40%, #56677c, #1c232d 75%)";

const SIDEARMS = new Set(["Classic", "Shorty", "Frenzy", "Ghost", "Sheriff", "Bandit"]);
const SPIKE = '<svg viewBox="0 0 40 42"><path d="M20 1 31 14 20 41 9 14Z" fill="#ff5148"/><path d="M20 8 25.5 15 20 31 14.5 15Z" fill="#ffd3cf"/><path d="M6 20h6M28 20h6" stroke="#ff5148" stroke-width="2"/></svg>';
const SPIKE_INK = '<svg viewBox="0 0 40 42"><path d="M20 1 31 14 20 41 9 14Z" fill="#111"/><path d="M20 9 25 15 20 29 15 15Z" fill="#c4c5ca"/></svg>';
const CRED = '<svg class="cri" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.2" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M2 2l2.6 2.6M14 2l-2.6 2.6M2 14l2.6-2.6M14 14l-2.6-2.6" stroke="#fff" stroke-width="1.6"/></svg>';
const SHIELD = (kind, w) => kind === "regen"
  ? `<span class="sh" style="left:${px(w)}"><svg viewBox="0 0 21 21"><circle cx="10.5" cy="10.5" r="9" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M9.3 5.5h2.4v3.8h3.8v2.4h-3.8v3.8H9.3v-3.8H5.5V9.3h3.8z" fill="#fff"/></svg></span>`
  : kind ? `<span class="sh" style="left:${px(w)}"><svg viewBox="0 0 21 21"><path d="M10.5 1 2.5 4v6c0 4.6 3.4 8 8 9.5 4.6-1.5 8-4.9 8-9.5V4z" fill="#fff"/></svg><span class="tx c">${kind === "heavy" ? 50 : 25}</span></span>` : "";
const WIN = {   // round-tracker marks, by how the round was won
  elimination: '<path d="M11 2a8 8 0 0 0-5 14v3h10v-3a8 8 0 0 0-5-14zm-3 8.5a1.8 1.8 0 1 1 0 .01zm6 0a1.8 1.8 0 1 1 0 .01z" fill="var(--c)"/>',
  spike: '<path d="M11 1l6 7-6 13-6-13z" fill="var(--c)"/><circle cx="11" cy="11" r="10" fill="none" stroke="var(--c)" stroke-width="1.5" stroke-dasharray="3 3"/>',
  defuse: '<path d="M11 2l6 7-6 12-6-12z" fill="none" stroke="var(--c)" stroke-width="2"/><path d="M4 18 18 4" stroke="var(--c)" stroke-width="2.4"/>',
  time: '<circle cx="11" cy="11" r="8.5" fill="none" stroke="var(--c)" stroke-width="2"/><path d="M11 6v5.5l3.5 2" stroke="var(--c)" stroke-width="2" fill="none"/>' };
const HOW = { elimination: "Elimination", spike: "Detonation", defuse: "Defuse", time: "Time" };
const secsOf = t => { const m = /^(\d+):(\d\d)$/.exec(t || ""); return m ? +m[1] * 60 + +m[2] : null; };

function ring(have, most) {   // the ult ring: one arc per point
  const n = Math.max(1, most || 7), r = 18, gap = n > 1 ? 0.22 : 0, seg = 2 * Math.PI / n;
  let d = "";
  for (let i = 0; i < n; i++) {
    const a0 = -Math.PI / 2 + i * seg + gap / 2, a1 = a0 + seg - gap, p = a => `${(20.5 + r * Math.cos(a)).toFixed(2)} ${(20.5 + r * Math.sin(a)).toFixed(2)}`;
    d += `<path d="M${p(a0)} A${r} ${r} 0 ${seg - gap > Math.PI ? 1 : 0} 1 ${p(a1)}" stroke="${i < have ? "#fff" : "rgba(255,255,255,.22)"}" stroke-width="3" fill="none"/>`;
  }
  return `<svg width="41" height="41" viewBox="0 0 41 41">${d}</svg>`;
}
const charges = c => `<span class="ch">${Array.from({ length: Math.max(1, Math.min(4, c[1] || 1)) }, (_, i) => `<b class="${i < c[0] ? "" : "used"}"></b>`).join("")}</span>`;
const at = (R, x, w) => R ? `right:${px(x)}` : `left:${px(x)}`;   // (the right team is laid out from its right edge)

function tab(p, R, color) {
  const dead = p.alive === false, hp = Math.max(0, Math.min(100, +p.health || 0)), id = p.agent_id;
  const ab = ["grenade", "ability1", "ability2"].map((part, i) => {
    const c = (p.abilities || {})["CQE"[i]] || [0, 1];
    return pic(id, part) ? `<span class="ab alive-only${c[0] ? "" : " none"}" style="top:14px;${at(R, R ? 171 + 31 * i : 171 + 31 * i)}"><img src="${pic(id, part)}" alt="">${charges(c)}</span>` : "";
  }).join("");
  const side = SIDEARMS.has(p.weapon), g = gunPic(p.weapon_id);
  return `<div class="ag">${pic(id, "displayicon") ? `<img src="${pic(id, "displayicon")}" alt="">` : ""}</div>`
    + `<span class="bdg${p.spike && !dead ? " on" : ""}" style="top:30px;${R ? "right:36px" : "left:36px"}">${SPIKE_INK}</span>`
    + `<span class="tx nm ui${R ? " r" : ""}" style="${at(R, 61)}"><i>${esc(p.name || "Player " + p.slot)}</i></span>` + ab
    + (pic(id, "ultimate") ? `<span class="ult" style="top:4px;${at(R, 262)}">${ring(+p.ult || 0, +p.ult_max || 7)}<img src="${pic(id, "ultimate")}" alt=""></span>`.replace('class="ult"', `class="ult${(+p.ult || 0) >= (+p.ult_max || 7) ? " ready" : ""}"`) : "")
    + `<span class="tx cr uir alive-only${R ? " r" : ""}" style="${at(R, 11)};width:96px">${CRED}${esc(p.credits ?? "")}</span>`
    + (g ? `<img class="gun alive-only ${side ? "side" : "main"}" style="${at(R, side ? 106 : 140)}" src="${g}" alt="">` : "")
    + `<span class="alive-only" style="top:54px;${at(R, 241)};width:21px;height:21px">${SHIELD(p.armor, 0)}</span>`
    + `<span class="tx hp uim alive-only${R ? "" : " r"}" style="${at(R, 262)}">${dead ? "" : hp}</span>`
    + `<span class="tx kda uir dead-only${R ? " r" : ""}" style="${at(R, 7)};width:120px">${+p.kills || 0} / ${+p.deaths || 0} / ${+p.assists || 0}</span>`
    + `<span class="tx cr uir dead-only${R ? "" : " r"}" style="${at(R, 233)};width:70px">${CRED}${esc(p.credits ?? "")}</span>`
    + `<span class="hb"><b style="width:${hp}%"></b></span>`;
}

function boxes(p, R, i, color) {
  const top = 785 + 56 * i, X = R ? { cr: 1741, ab: 1588, gun: 1355, who: 965 } : { cr: 16, ab: 189, gun: 342, who: 575 }, id = p.agent_id, dead = p.alive === false;
  const ab = ["grenade", "ability1", "ability2"].map((part, k) => { const c = (p.abilities || {})["CQE"[k]] || [0, 1];
    return pic(id, part) ? `<span class="ab${c[0] ? "" : " none"}" style="${at(R, 13 + 44 * k)}"><img src="${pic(id, part)}" alt="">${charges(c)}</span>` : ""; }).join("");
  const g = gunPic(p.weapon_id), ready = (+p.ult || 0) >= (+p.ult_max || 7);
  return `<div class="box ${R ? "R" : "L"}" style="left:${X.cr}px;top:${top}px;width:164px"><span class="tx sp uir${R ? " r" : ""}" style="${at(R, 11)};width:70px"></span><span class="tx cr uir${R ? "" : " r"}" style="${at(R, 9)};width:100px">${CRED}${esc(p.credits ?? "")}</span></div>`
    + `<div class="box ${R ? "R" : "L"}" style="left:${X.ab}px;top:${top}px;width:144px">${ab}</div>`
    + `<div class="box ${R ? "R" : "L"}" style="left:${X.gun}px;top:${top}px;width:224px"><span class="si" style="${at(R, 11)}">${p.armor ? SHIELD(p.armor, 2).replace(/class="sh"/, 'class="sh" ') : ""}</span>${g ? `<img class="gun" style="${at(R, 54)}" src="${g}" alt="">` : ""}${pic(id, "ultimate") ? `<span class="ult${ready ? " ready" : ""}" style="${at(R, 172)}">${ring(+p.ult || 0, +p.ult_max || 7)}<img src="${pic(id, "ultimate")}" alt=""></span>` : ""}</div>`
    + `<div class="box who ${R ? "R" : "L"}${dead ? " dead" : ""}" style="left:${X.who}px;top:${top}px;width:381px;--c:${color}"><span class="ag">${pic(id, "displayicon") ? `<img src="${pic(id, "displayicon")}" alt="">` : ""}</span><span class="tx nm ui${R ? " r" : ""}" style="${at(R, 85)}"><i>${esc(p.name || "")}</i></span><span class="tx kda uir${R ? "" : " r"}" style="${at(R, 18)}">${+p.kills || 0} / ${+p.deaths || 0} / ${+p.assists || 0}</span></div>`;
}

function tracker(h) {
  const n = Math.max(24, h.history.length), cur = h.history.length;
  let g = "";
  for (let i = 0; i < n; i++) {
    const x = 9 + 37 * i, w = h.history[i];
    g += `<span class="tx c num ui" style="left:${x}px">${i + 1}</span>`;
    for (const t of [0, 1]) {
      const won = w && w.winner === t;
      g += `<span class="cell${won ? " won" : ""}" style="left:${x}px;top:${t ? 58 : 22}px;--c:${h.teams[t].color}">${won ? `<svg viewBox="0 0 22 22">${WIN[w.how] || WIN.elimination}</svg>` : ""}</span>`;
    }
    if (i === 12 || (i > 23 && i % 2 === 0)) g += `<span class="half" style="left:${x - 3}px"></span>`;
  }
  if (cur < n) g += `<span class="now" style="left:${6 + 37 * cur}px"></span>`;
  const tm = (t, y) => `<div class="tm" style="top:${y}px;--c:${t.color}"><span class="e"></span>${t.logo ? `<img src="${esc(t.logo)}" alt="">` : ""}<span class="tx cd">${esc(t.short || t.name.slice(0, 3).toUpperCase())}</span><span class="dot${t.timeouts < 2 ? " used" : ""}" style="top:10px"></span><span class="dot${t.timeouts < 1 ? " used" : ""}" style="top:26px"></span></div>`;
  return `<div id="tk">${tm(h.teams[0], 14)}${tm(h.teams[1], 64)}<div class="grid">${g}</div></div>`;
}

let rwKey = "", rwUntil = 0;
function draw(h) {
  $("s").classList.toggle("off", !h.live);
  const [L, R] = h.teams, st = document.documentElement.style;
  st.setProperty("--L", L.color); st.setProperty("--R", R.color);
  const secs = secsOf(h.timer), planted = h.spike === "planted";
  const cond = planted || (h.phase === "combat" && secs != null && secs <= 79);   // (names tuck away 20 s into the round, or at the plant)
  const half = cond ? { l: 710, w: 180, rw: 181, logoL: 750, logoR: 1121, lt: 11, ls: 50 } : { l: 625, w: 265, rw: 265, logoL: 657, logoR: 1226, lt: 18, ls: 37 };
  const need = Math.ceil((+h.best_of || 3) / 2), pips = (t, x) => `<span class="pv" style="left:${x}px;--c:${t.color}">${Array.from({ length: need }, (_, i) => `<b class="${i < (+t.series || 0) ? "won" : ""}"></b>`).join("")}</span>`;
  $("top").className = planted ? "planted" : "";
  set($("top"), `<span class="ol ez" style="top:0;left:${half.l}px;width:${1920 - 2 * half.l}px"></span><span class="ol ez" style="top:71px;left:${half.l}px;width:${1920 - 2 * half.l}px"></span>`
    + `<div class="h l ez" style="left:${half.l}px;width:${half.w}px"><div class="f"></div><div class="e"></div></div>`
    + `<div class="h r ez" style="left:1030px;width:${half.rw}px"><div class="f"></div><div class="e"></div></div>`
    + `<span style="left:829px;top:1px;width:1px;height:70px;background:#fff"></span><span style="left:1089px;top:1px;width:1px;height:70px;background:#fff"></span>`
    + (L.logo ? `<img class="lg ez" src="${esc(L.logo)}" style="left:${half.logoL}px;top:${half.lt}px;width:${half.ls}px;height:${half.ls}px" alt="">` : "")
    + (R.logo ? `<img class="lg ez" src="${esc(R.logo)}" style="left:${half.logoR}px;top:${half.lt}px;width:${half.ls}px;height:${half.ls}px" alt="">` : "")
    + `<span class="tx c tri tl ez" style="left:714px;top:18px;width:100px;opacity:${cond ? 0 : 1}">${esc(L.short || L.name.slice(0, 3).toUpperCase())}</span>`
    + `<span class="tx c sub cd ez" style="left:709px;top:45px;width:110px;opacity:${cond ? 0 : 1}">${esc(L.name.toUpperCase())}</span>`
    + `<span class="tx c tri tl ez" style="left:1100px;top:18px;width:100px;opacity:${cond ? 0 : 1}">${esc(R.short || R.name.slice(0, 3).toUpperCase())}</span>`
    + `<span class="tx c sub cd ez" style="left:1095px;top:45px;width:110px;opacity:${cond ? 0 : 1}">${esc(R.name.toUpperCase())}</span>`
    + pips(L, 846) + pips(R, 1063)
    + `<span class="tx c sc cd" style="left:860px">${L.score}</span><span class="tx c sc cd" style="left:998px">${R.score}</span>`
    + `<span class="tx c rnd cd">ROUND ${+h.round}</span>`);
  if (!$("bomb").firstChild) $("bomb").innerHTML = SPIKE;
  $("bomb").classList.toggle("on", planted);
  // buy phase: the board comes up, the tabs go out
  const buy = h.phase === "buy";
  $("bd").classList.toggle("away", !buy); $("sl").classList.toggle("away", buy); $("sr").classList.toggle("away", buy);
  set($("bd"), `<div class="bar"></div>${L.logo ? `<img class="mk" src="${esc(L.logo)}" style="left:678px" alt="">` : ""}${R.logo ? `<img class="mk" src="${esc(R.logo)}" style="left:1069px" alt="">` : ""}`
    + (h.players[0] || []).map((p, i) => boxes(p, false, i, L.color)).join("") + (h.players[1] || []).map((p, i) => boxes(p, true, i, R.color)).join("") + tracker(h));
  for (const [s, el] of [[0, $("sl")], [1, $("sr")]]) {
    const list = h.players[s] || [], color = h.teams[s].color;
    while (el.children.length < list.length) el.appendChild(document.createElement("div"));
    while (el.children.length > list.length) el.lastChild.remove();
    list.forEach((p, i) => { const d = el.children[i], cls = "tab" + (p.alive === false ? " dead" : "");
      if (d.className !== cls) d.className = cls;
      d.style.cssText = `top:${551 + 106 * i}px;${s ? "left:1593px" : "left:17px"};--c:${color}`;
      set(d, tab(p, !!s, color)); });
  }
  // round won: the big graphic for four seconds, then the banner under the top bar
  const last = h.history[h.history.length - 1];
  if (last && h.phase === "end") {
    const key = h.history.length + ":" + last.winner;
    if (key !== rwKey) { rwKey = key; rwUntil = Date.now() + 4200; }
    const t = h.teams[last.winner];
    set($("rw"), `<div class="bg"></div><div class="fl"></div><div class="cr"><svg viewBox="0 0 165 165" style="left:0;top:0;width:165px;height:165px"><path d="M82.5 4 156 34v52c0 39-31 66-73.5 75C40 152 9 125 9 86V34z" fill="#111823" stroke="#f9c229" stroke-width="5"/></svg>${t.logo ? `<img src="${esc(t.logo)}" alt="">` : ""}</div>`
      + `<div class="tx c wd tl">ROUND WIN</div><div class="bar"></div><div class="tx c who tl"><span>${esc(t.name)}</span><span>${esc(t.side === "ATK" ? "Attack" : "Defence")}</span><span>${esc(HOW[last.how] || "")}</span></div>`);
    $("ban").style.setProperty("--c", t.color); set($("ban").querySelector(".tx"), `${esc(t.name.toUpperCase())} WIN · ${esc((HOW[last.how] || "").toUpperCase())}`);
  }
  const on = Date.now() < rwUntil;
  $("rw").classList.toggle("on", on); $("rw").classList.toggle("out", on && rwUntil - Date.now() < 400);
  $("ban").classList.toggle("on", h.phase === "end" && !on && !!last);
}

async function tick() {
  try { draw(await (await fetch("/api/val/hud", { cache: "no-store" })).json()); } catch (e) { $("s").classList.add("off"); }
  setTimeout(tick, 250);
}
tick();
</script>
</body>
</html>
