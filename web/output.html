<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StandBy GFX output</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body.dark { background: #0b0b0d; } body.green { background: #00b140; }
  body.checker { background: repeating-conic-gradient(#2a2a2e 0 25%, #1f1f22 0 50%) 0 0 / 20px 20px; }
  .sg-stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; }
  .sg-comp, .sg-cover, .sg-stinger { position: absolute; inset: 0; }
  .sg-cover { z-index: 9000; }
  .sg-stinger { z-index: 9500; width: 100%; height: 100%; object-fit: cover; }
  .sg-layer { position: absolute; box-sizing: border-box; }
  .sg-fill { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .sg-text { white-space: pre; display: inline-block; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
import { Stage, W, H } from "./engine/stage.js";
// ?bus=preview, ?comp=<id> (that graphic only, always on), ?monitor=1 (muted, not counted), ?bg=checker
const q = new URLSearchParams(location.search);

// Errors on this page go to the engine's Error log (Show check > Error log), so we know what broke.
{
  let sent = 0;
  const report = (msg, src, line, stack) => {
    if (++sent > 30) return;   // (a loop of the same error mustn't flood the log)
    fetch("/api/log", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ page: "output " + location.search, msg: String(msg || "error"), src, line, stack }) }).catch(() => {});
  };
  addEventListener("error", e => { if (e.message) report(e.message, e.filename, e.lineno, e.error && e.error.stack); }, true);
  addEventListener("unhandledrejection", e => { const r = e.reason || {}; report(r.message || String(r), "", "", r.stack); });
}
if (q.get("bg")) document.body.classList.add(q.get("bg"));
const root = document.getElementById("stage");
let force = null;   // (?force={"VALORANT":{"Buy phase":"yes"}}: the HUD Builder's preview of one phase)
try { force = q.get("force") ? JSON.parse(q.get("force")) : null; } catch (e) { /* a bad link shows the live HUD */ }
const stage = new Stage(root, { bus: q.get("hud") ? "hud" : q.get("bus") || "program", comp: q.get("comp"), hud: q.get("hud"), muted: q.get("monitor") === "1", all: q.get("all") === "1", force });
// fit the 1920x1080 stage to the window
const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); root.style.transform = `scale(${k})`; };
addEventListener("resize", fit); fit();
let state = null;
// Fonts: the built-in ones, then every font file the engine has (known by its file name).
const BUILTIN = [["Inter", "Inter.ttf", "100 900"], ["Anton", "Anton-Regular.ttf"], ["Bebas Neue", "BebasNeue.ttf"], ["Permanent Marker", "PermanentMarker-Regular.ttf"],
  ["Montserrat", "Montserrat-400.woff2", "400"], ["Montserrat", "Montserrat-500.woff2", "500"], ["Montserrat", "Montserrat-700.woff2", "700"], ["Montserrat", "Montserrat-800.woff2", "800"], ["Montserrat", "Montserrat-900.woff2", "900"],
  ["Barlow Condensed", "BarlowCondensed-500.woff2", "500"], ["Barlow Condensed", "BarlowCondensed-600.woff2", "600"], ["Barlow Condensed", "BarlowCondensed-700.woff2", "700"],
  ["Vazirmatn", "Vazirmatn-700.woff2", "700"], ["Vazirmatn", "Vazirmatn-900.woff2", "900"]];
const fontCss = document.createElement("style");
document.head.appendChild(fontCss);
let fontSig = "";
function loadFonts(list) {
  const sig = JSON.stringify(list || []);
  if (sig === fontSig) return;
  fontSig = sig;
  const face = (name, url, weight) => `@font-face{font-family:"${name.replace(/"/g, "")}";src:url("${encodeURI(url)}");${weight ? `font-weight:${weight};` : ""}font-display:block}`;
  fontCss.textContent = [...BUILTIN.map(([n, f, w]) => face(n, "fonts/" + f, w)), ...(list || []).map(f => face(f.name, f.url))].join(String.fromCharCode(10));
}
const apply = msg => { if (msg.fonts) loadFonts(msg.fonts); state = Object.assign({}, state, msg); if (state.project && state.live) stage.apply(state); };
const out = q.get("monitor") === "1" ? "" : q.get("hud") ? "hud:" + q.get("hud") : q.get("comp") ? "comp:" + q.get("comp") : (q.get("bus") || "program");
// A monitor inside the control page gets the state from the page (one connection, not one per monitor).
const fed = q.get("monitor") === "1" && window.parent !== window;
if (fed) {
  addEventListener("message", e => { if (e.origin === location.origin && e.data && e.data.sgState) apply(e.data.sgState); });
  window.parent.postMessage({ sgReady: true }, location.origin);
} else {
  fetch("/api/state").then(r => r.json()).then(apply).finally(() => {
    const es = new EventSource("/api/stream" + (out ? "?out=" + encodeURIComponent(out) : ""));
    es.onmessage = e => apply(JSON.parse(e.data));
  });
}
</script>
</body>
</html>
